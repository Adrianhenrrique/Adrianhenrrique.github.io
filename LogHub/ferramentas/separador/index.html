<main>
  <h1>Separador de números</h1>
  <p class="sub">Cole os números do jeito que vierem (um por linha, com espaço, copiados do Excel). A lista sai pronta com vírgula entre cada um.</p>

  <div class="bancada">
    <section class="lado">
      <div class="topo">
        <label for="entrada">Seus números</label>
        <span class="conta" id="contaEntrada"></span>
      </div>
      <textarea id="entrada" spellcheck="false" autocomplete="off" placeholder="1002345
1002346
1002399"></textarea>
      <div class="rodape">
        <button type="button" id="limpar">Limpar</button>
      </div>
    </section>

    <section class="lado">
      <div class="topo">
        <label for="saida">Pronto para consultar</label>
        <span class="conta" id="contaSaida"></span>
      </div>
      <textarea id="saida" readonly spellcheck="false" placeholder="O resultado aparece aqui enquanto você cola."></textarea>
      <div class="rodape">
        <button type="button" class="principal" id="copiar" disabled>Copiar lista</button>
        <span class="aviso" id="aviso" role="status" aria-live="polite"></span>
      </div>
    </section>
  </div>

  <fieldset>
    <legend>Formato da lista</legend>
    <label class="opcao"><input type="checkbox" id="optEspaco"> Espaço depois da vírgula <code>1, 2, 3</code></label>
    <label class="opcao"><input type="checkbox" id="optAspas"> Entre aspas simples <code>'1','2','3'</code></label>
    <label class="opcao"><input type="checkbox" id="optParenteses"> Entre parênteses <code>(1,2,3)</code></label>
    <label class="opcao"><input type="checkbox" id="optRepetidos"> Tirar repetidos</label>
  </fieldset>
</main>

<script>
(function () {
  var entrada = document.getElementById('entrada');
  var saida = document.getElementById('saida');
  var contaEntrada = document.getElementById('contaEntrada');
  var contaSaida = document.getElementById('contaSaida');
  var copiar = document.getElementById('copiar');
  var limpar = document.getElementById('limpar');
  var aviso = document.getElementById('aviso');
  var opcoes = ['optEspaco', 'optAspas', 'optParenteses', 'optRepetidos'];
  var CHAVE = 'separador-numeros-opcoes';
  var avisoTimer = null;

  function lerOpcoes() {
    try {
      var salvo = JSON.parse(localStorage.getItem(CHAVE) || '{}');
      opcoes.forEach(function (id) {
        if (typeof salvo[id] === 'boolean') document.getElementById(id).checked = salvo[id];
      });
    } catch (e) { /* sem armazenamento: segue com o padrão */ }
  }
  function salvarOpcoes() {
    try {
      var estado = {};
      opcoes.forEach(function (id) { estado[id] = document.getElementById(id).checked; });
      localStorage.setItem(CHAVE, JSON.stringify(estado));
    } catch (e) { /* ignora */ }
  }
  function marcado(id) { return document.getElementById(id).checked; }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

  function converter() {
    // separa por quebra de linha, espaço, tab, vírgula, ponto e vírgula ou barra vertical
    var itens = entrada.value
      .split(/[\s,;|]+/)
      .map(function (t) { return t.replace(/^['"]+|['"]+$/g, ''); })
      .filter(function (t) { return t.length > 0; });

    var total = itens.length;
    var removidos = 0;

    if (marcado('optRepetidos')) {
      var vistos = Object.create(null);
      itens = itens.filter(function (t) {
        if (vistos[t]) return false;
        vistos[t] = true;
        return true;
      });
      removidos = total - itens.length;
    }

    if (marcado('optAspas')) {
      itens = itens.map(function (t) { return "'" + t + "'"; });
    }

    var texto = itens.join(marcado('optEspaco') ? ', ' : ',');
    if (texto && marcado('optParenteses')) texto = '(' + texto + ')';

    saida.value = texto;
    copiar.disabled = !texto;
    contaEntrada.textContent = total ? plural(total, 'número', 'números') : '';
    contaSaida.textContent = !total ? '' :
      plural(itens.length, 'na lista', 'na lista') +
      (removidos ? ', ' + plural(removidos, 'repetido tirado', 'repetidos tirados') : '');
  }

  function avisar(msg) {
    aviso.textContent = msg;
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function () { aviso.textContent = ''; }, 2500);
  }

  function copiarLista() {
    var texto = saida.value;
    if (!texto) return;
    function reserva() {
      saida.focus();
      saida.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      avisar(ok ? 'Lista copiada' : 'Lista selecionada: aperte Ctrl+C');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { avisar('Lista copiada'); }, reserva);
    } else {
      reserva();
    }
  }

  entrada.addEventListener('input', converter);
  copiar.addEventListener('click', copiarLista);
  limpar.addEventListener('click', function () {
    entrada.value = '';
    converter();
    entrada.focus();
  });
  saida.addEventListener('focus', function () { saida.select(); });
  opcoes.forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      salvarOpcoes();
      converter();
    });
  });

  lerOpcoes();
  converter();
})();
</script>
